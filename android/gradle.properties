# Mémoire adaptée à un PC de 8 Go de RAM (le réglage d'origine réservait 8 Go et faisait planter Java).
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=192m
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
